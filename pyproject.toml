[project]
authors = [{ name = "Jose", email = "jlmoraleshellin@gmail.com" }]
name = "prosapia"
requires-python = ">= 3.11"
dynamic = ["version"]
dependencies = [
    "pandas>=3.0.2,<4",
    "gemmi>=0.7.5,<0.8",
    "argcomplete>=3.7.2",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.2.3",
]
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
sapia = "prosapia.cli.cli:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "uv-dynamic-versioning"]

[tool.hatch.build.targets.wheel]
packages = ["src/prosapia"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
metadata = true
fallback-version = "0.0.0"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
