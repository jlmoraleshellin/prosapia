[project]
authors = [{ name = "Jose", email = "jlmoraleshellin@gmail.com" }]
name = "prosapia"
requires-python = ">= 3.11"
version = "0.1.0"
dependencies = [
    "pandas>=3.0.2,<4",
    "gemmi>=0.7.5,<0.8",
    "argcomplete>=3.7.2",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.2.3",
]

[project.scripts]
new_run_dir = "prosapia.new_run_dir:main"
sapia = "prosapia.cli:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/prosapia"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
